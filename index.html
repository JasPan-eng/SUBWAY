<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SUBWAY — J line splat</title>
    <style>
      :root {
        color-scheme: dark;
        --fg: #dfe6ec;
        --bg: #07090c;
      }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
      html { scrollbar-width: thin; scrollbar-color: rgba(223,230,236,0.25) transparent; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #status {
        position: fixed; left: 16px; bottom: 16px; padding: 8px 12px;
        background: rgba(7, 9, 12, 0.7); border: 1px solid rgba(223, 230, 236, 0.15); border-radius: 6px;
        pointer-events: none; white-space: pre; max-width: calc(100vw - 32px);
      }
      #drop {
        position: fixed; inset: 0; display: none; place-items: center;
        background: rgba(7, 9, 12, 0.6); border: 2px dashed rgba(223, 230, 236, 0.5);
        font-size: 18px; pointer-events: none;
      }
      body.dragging #drop { display: grid; }

      /* ---- look pass: grain, vignette, HUD (src/look.js) ---- */
      .look-grain {
        position: fixed; inset: -64px; pointer-events: none; z-index: 5;
        background-repeat: repeat; background-size: 243px 243px;
        mix-blend-mode: overlay; opacity: 0.18;
        animation: look-grain 1s steps(6) infinite;
      }
      @keyframes look-grain {
        0% { transform: translate(0, 0); } 20% { transform: translate(-22px, 14px); }
        40% { transform: translate(18px, -30px); } 60% { transform: translate(-34px, -8px); }
        80% { transform: translate(26px, 22px); } 100% { transform: translate(0, 0); }
      }
      .look-vignette {
        --vignette-amount: 0.55; --vignette-start: 55%;
        position: fixed; inset: 0; pointer-events: none; z-index: 4;
        background: radial-gradient(ellipse at center, transparent var(--vignette-start), rgba(0, 0, 0, var(--vignette-amount)) 100%);
      }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: 6; }

      /* ---- scroll story (src/story.js) ---- */
      #story-spacer { position: relative; width: 1px; pointer-events: none; }
      #story-caption {
        position: fixed; left: 48px; bottom: 96px; z-index: 7; pointer-events: none; max-width: min(560px, 70vw);
        transition: opacity 0.25s linear;
      }
      .story-title { font: 600 clamp(26px, 4.2vw, 52px)/1.05 ui-sans-serif, system-ui, "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.02em; color: #eef3f8; text-shadow: 0 2px 24px rgba(0,0,0,0.6); }
      .story-sub { margin-top: 10px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #9fc3ff; opacity: 0.9; }
      #story-hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 7; pointer-events: none; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(223,230,236,0.6); transition: opacity 0.6s; }
      #status { left: auto; right: 16px; bottom: 16px; font-size: 11px; opacity: 0.6; max-width: 46vw; }
      #status { z-index: 7; }
      .lil-gui { z-index: 8 !important; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">loading…</div>
    <div id="drop">drop a .spz / .ply / .splat / .ksplat file</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
