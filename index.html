<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SUBWAY — a ride on the J</title>
    <meta name="description" content="A Gaussian-splat ride through a graffiti-covered New York subway car on the elevated J line, from Flushing Av to Kosciuszko St." />
    <style>
      :root {
        color-scheme: dark;
        /* neutrals: one cool ramp, no pure black or white */
        --bg: #0b0d12;
        --fg: #e9e7e2;
        --fg-dim: #a9a7a1;
        --line: rgba(233, 231, 226, 0.18);
        --panel: #15181f;
        --j: #996633; /* MTA J/Z bullet */
        /* type */
        --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
        --mono: ui-monospace, Menlo, Consolas, monospace;
        /* spacing scale (4px base) */
        --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s6: 24px; --s8: 32px; --s12: 48px;
        /* overlays */
        --z-look: 10; --z-ride: 20; --z-intro: 30; --z-gui: 40;
      }
      html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font); }
      html { scrollbar-width: none; }
      html::-webkit-scrollbar { display: none; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }

      /* ---- developer readouts: only with ?gui / H */
      #status {
        position: fixed; right: var(--s4); bottom: var(--s4); z-index: var(--z-gui); padding: var(--s2) var(--s3);
        background: rgba(11, 13, 18, 0.8); border: 1px solid var(--line); border-radius: 4px;
        font: 11px/1.4 var(--mono); color: var(--fg-dim); pointer-events: none; white-space: pre; max-width: 46vw; display: none;
      }
      #drop {
        position: fixed; inset: 0; display: none; place-items: center; z-index: var(--z-intro);
        background: rgba(11, 13, 18, 0.7); border: 2px dashed var(--line); font-size: 18px; pointer-events: none;
      }
      body.dragging #drop { display: grid; }
      .lil-gui { z-index: var(--z-gui) !important; }

      /* ---- look pass: grain, vignette, HUD (src/look.js) */
      .look-grain {
        position: fixed; inset: -64px; pointer-events: none; z-index: var(--z-look);
        background-repeat: repeat; background-size: 243px 243px; mix-blend-mode: overlay; opacity: 0.18;
        animation: look-grain 1s steps(6) infinite;
      }
      @keyframes look-grain {
        0% { transform: translate(0, 0); } 20% { transform: translate(-22px, 14px); }
        40% { transform: translate(18px, -30px); } 60% { transform: translate(-34px, -8px); }
        80% { transform: translate(26px, 22px); } 100% { transform: translate(0, 0); }
      }
      .look-vignette {
        --vignette-amount: 0.55; --vignette-start: 55%;
        position: fixed; inset: 0; pointer-events: none; z-index: var(--z-look);
        background: radial-gradient(ellipse at center, transparent var(--vignette-start), rgba(0, 0, 0, var(--vignette-amount)) 100%);
      }
      #hud { position: fixed; inset: 0; pointer-events: none; z-index: var(--z-look); }

      /* ---- the ride (src/story.js) */
      #ride-spacer { position: relative; width: 1px; pointer-events: none; }

      .j-bullet {
        display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; border-radius: 50%;
        background: var(--j); color: #fff; font-weight: 700; font-size: 0.8em; line-height: 1; letter-spacing: 0;
        flex: none;
      }
      .label { font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--fg-dim); }

      /* station sign while loading */
      .ride-intro {
        position: fixed; inset: 0; z-index: var(--z-intro); isolation: isolate; display: grid; place-items: center; gap: var(--s6);
        grid-template-rows: 1fr auto 1fr; background: var(--bg); padding: var(--s6);
        transition: opacity 400ms ease-in;
      }
      .ride-intro.is-leaving { opacity: 0; pointer-events: none; }
      .ride-intro .sign {
        grid-row: 2; width: min(520px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
        padding: var(--s6); display: grid; gap: var(--s4);
      }
      .sign-head { display: flex; align-items: center; gap: var(--s3); font-size: 28px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.1; }
      .sign-head .j-bullet { font-size: 22px; }
      .sign-next { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s4); padding-top: var(--s3); border-top: 1px solid var(--line); }
      .sign-stop { font-size: 20px; font-weight: 700; }
      .sign-bar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
      .sign-fill { height: 100%; width: 100%; background: var(--fg); transform-origin: left; transform: scaleX(0); transition: transform 200ms ease-out; }
      .sign-foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
      .ride-cta {
        grid-row: 3; align-self: start; appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg);
        font: 500 13px/1 var(--font); letter-spacing: 0.14em; text-transform: uppercase; padding: var(--s3) var(--s6); border-radius: 999px;
        cursor: pointer; opacity: 0; transition: opacity 250ms ease-out, background-color 150ms ease, border-color 150ms ease;
      }
      .ride-intro.is-ready .ride-cta { opacity: 1; }
      .ride-cta:hover { background: rgba(233, 231, 226, 0.08); border-color: var(--fg-dim); }
      .ride-cta:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
      .ride-cta:active { background: rgba(233, 231, 226, 0.14); }

      /* route strip */
      .ride-strip {
        position: fixed; left: var(--s12); right: calc(var(--s12) + 64px); bottom: var(--s8); height: 40px; z-index: var(--z-ride); pointer-events: none;
      }
      .strip-line { position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: var(--line); }
      .strip-stop { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; gap: var(--s2); }
      .strip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg); margin-top: 8px; }
      .strip-name { font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-dim); white-space: nowrap; }
      .strip-marker { position: absolute; top: 2px; transform: translateX(-50%); font-size: 13px; transition: left 120ms linear; }
      .strip-marker .j-bullet { box-shadow: 0 0 0 3px var(--bg); }

      /* stop caption */
      .ride-caption {
        position: fixed; left: var(--s12); bottom: 104px; z-index: var(--z-ride); pointer-events: none; max-width: min(560px, 70vw);
        transition: opacity 250ms linear;
      }
      .cap-sign { display: flex; align-items: center; gap: var(--s3); font-size: clamp(32px, 5vw, 64px); font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
      .cap-sign .j-bullet { font-size: 0.5em; }
      .ride-caption:not(.is-station) .cap-sign { font-weight: 300; }
      .cap-sub { margin-top: var(--s2); font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); }

      @media (max-width: 700px) {
        .ride-strip { left: var(--s4); right: var(--s4); bottom: var(--s4); }
        .ride-caption { left: var(--s4); bottom: 84px; }
        .strip-name { display: none; }
      }
      @media (prefers-reduced-motion: reduce) {
        .look-grain { animation: none; }
        .ride-intro, .ride-cta, .ride-caption, .strip-marker, .sign-fill { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="status">loading…</div>
    <div id="drop">drop a .spz / .ply / .splat / .ksplat file</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
